name: Build Flutter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'flutterforge123' }}
    steps:
      - name: Environment Setup - checkout
        uses: actions/checkout@v4
      - name: Environment Setup - Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Environment Setup - Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Environment Setup - Android platform
        run: |
          NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          if [ ! -d android ]; then flutter create --platforms=android --org com.flutterforge --project-name "$NAME" . ; fi
      - name: Flutter Pub Get
        run: flutter pub get
      - name: Sign & Bundle - prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          else
            keytool -genkeypair -v -keystore android/app/upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=App, O=App, C=US"
          fi
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle.kts"
          if os.path.exists(p):
              s = open(p).read()
              if 'create("release")' not in s:
                  block = '''    signingConfigs {
                  create("release") {
                      storeFile = file("upload.jks")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "upload"
                      keyPassword = System.getenv("KS_PASS")
                  }
              }
          '''
                  s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
                  s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
                  open(p, "w").write(s)
          PY
      - name: Gradle Compilation - APK
        run: flutter build apk --release
      - name: Sign & Bundle - AAB
        run: flutter build appbundle --release
      - name: Sign & Bundle - tag
        id: tag
        run: echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Ready - publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ steps.tag.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
